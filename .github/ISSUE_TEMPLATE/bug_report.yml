name: '🐞 Bug melden'
description: 'Fehler im Kompendium melden'
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Danke fürs Melden! Bitte alle Felder ausfüllen — je genauer, desto schneller gefixt.

  - type: textarea
    id: what-happened
    attributes:
      label: 'Was ist passiert?'
      description: 'Kurz beschreiben, was schiefläuft.'
      placeholder: 'Beim Klick auf eine Karte öffnet sich die Detail-Ansicht nicht.'
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 'Schritte zum Reproduzieren'
      description: 'Wie kann man den Fehler nachstellen?'
      placeholder: |
        1. Seite öffnen
        2. Auf Karte "Brute-Force" klicken
        3. Nichts passiert
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 'Erwartetes Verhalten'
      placeholder: 'Die Detail-Ansicht sollte sich öffnen.'
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 'Betroffener Bereich'
      options:
        - Cards
        - Suche
        - Filter
        - Detail-Ansicht
        - Bookmarks
        - Config-Copy
        - i18n / Sprache
        - Design / Responsive / a11y
        - Daten / Inhalte
        - Sonstiges
    validations:
      required: true

  - type: input
    id: branch
    attributes:
      label: 'Branch / Commit'
      description: 'Auf welchem Branch? (z.B. dev, feature/xy)'
      placeholder: 'dev'
    validations:
      required: false

  - type: textarea
    id: console
    attributes:
      label: 'Konsolen-Fehler (F12)'
      description: 'Rote Fehler aus der Browser-Konsole hier einfügen.'
      render: shell
    validations:
      required: false

  - type: dropdown
    id: browser
    attributes:
      label: 'Browser'
      options:
        - Chrome
        - Firefox
        - Edge
        - Safari
        - Sonstiger
    validations:
      required: false
